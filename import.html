<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Import Bookmarks</title>
		<link href="css/import.css" rel="stylesheet" type="text/css" />
		<script src="js/import.js" defer></script>
	</head>
	<body>
		<div class="import-container">
			<h1>Import Bookmarks</h1>
			<p>
				Choose a file that was exported with the "Export Bookmarks" button. Videos in the file will be added to your
				bookmarks. If a video already has bookmarks, they will be replaced by the ones in the file.
			</p>
			<input id="import-file-input" type="file" aria-label="Bookmarks file" accept=".json,application/json" />
			<p id="import-message" class="import-message" role="status"></p>
		</div>
	</body>
</html>
